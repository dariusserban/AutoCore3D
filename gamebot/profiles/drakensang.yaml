# Drakensang Online - profil care merge din prima, fara calibrare.
#
# Regiunile sunt scrise ca PROCENTE din fereastra jocului (`rel: [x, y, lat, inalt]`),
# nu in pixeli. Botul isi gaseste singur fereastra, o masoara si calculeaza
# coordonatele reale. Merge la orice rezolutie si daca muti fereastra.
#
# Bara de viata nu e urmarita deloc, la cerere: botul nu se vindeca singur si nu
# se opreste din cauza ei. Vindecarea ramane treaba ta.

name: drakensang
monitor: 1

# Dupa ce fragment de titlu cautam fereastra jocului.
window:
  title: Drakensang

regions:
  # Minimapa DSO e sus-STANGA (masurata dintr-un screenshot real, 1906x1016
  # arie de client). E semi-transparenta, deci se vede si terenul prin ea -
  # ceea ce o face o ancora buna: se schimba cand te misti.
  #
  # Daca o ai inchisa in joc, sterge blocul asta: fara `minimap`, ancorele se
  # iau din tot ecranul, micsorat, si merge si asa.
  minimap:
    rel: [0.031, 0.104, 0.226, 0.453]

colors:
  # Rosul barelor de viata de deasupra mob-urilor - detectorul de dusmani.
  enemy_nameplate:
    low: [0, 120, 90]
    high: [10, 255, 255]

  # Culorile etichetelor de obiect cazut, pe raritati. Albul si griul lipsesc
  # intentionat: ar prinde jumatate din textul interfetei.
  loot_verde:
    low: [40, 90, 90]
    high: [80, 255, 255]
  loot_albastru:
    low: [95, 90, 90]
    high: [130, 255, 255]
  loot_violet:
    low: [130, 70, 90]
    high: [160, 255, 255]
  loot_auriu:
    low: [18, 110, 120]
    high: [32, 255, 255]

keys:
  forward: ""         # DSO merge prin click, nu are taste de directie
  interact: ""
  loot: ""            # daca ai o tasta de ridicat, pune-o aici
  target_next: ""
  escape: ""
  mount: ""           # tasta de montura; gol = nu urca

  attack_rotation: ["1", "2", "3", "4"]

thresholds:
  template_match: 0.85
  anchor_match: 0.68   # putin mai permisiv: ancora e tot ecranul, care variaza

behaviors:
  survival: false     # scos la cerere: nu se uita deloc la viata
  combat: true
  loot: true
  travel: true
  mount: true
  gather: false
  upkeep: false
  idle_click: false

input:
  movement: click       # click-to-move
  click_radius: 3
  move_speed: 1.0

combat:
  mode: aim             # ARPG: cursorul pe gramada, abilitatile in zona
  anywhere: false

  enemy_color: enemy_nameplate
  enemy_min_area: 40
  cluster_radius: 160

  # Trece prin: se bate doar cu ce-i iese in cale, nu vaneaza tot ecranul.
  only_when_blocking: true
  engage_radius: 260

  approach_seconds: 1.2
  global_cooldown: 1.0
  max_fight_seconds: 40
  basic_attack_click: true
  loot_after_kill: false   # de adunat se ocupa comportamentul `loot`

  # Se completeaza singur din luptele tale, cu butonul "Invata din ruta".
  abilities: []

loot:
  colors: [loot_verde, loot_albastru, loot_violet, loot_auriu]
  min_area: 25          # etichetele sunt mici; sub atat e zgomot
  pickup_radius: 420    # nu traversam harta dupa un obiect din colt
  max_per_pass: 4
  click_delay: 0.45
  click_offset_y: 12    # eticheta e deasupra obiectului; dam click pe obiect
  blacklist_seconds: 20
  interval: 1.0
  press_key_blindly: false

pickup:
  # Culesul pornit de tine, cu o tasta, cu cerc desenat peste joc.
  hotkey: f7            # apesi o data = pornit, inca o data = oprit
  radius: 260           # raza cercului, in pixeli de ecran
  culoare: "#3fd977"    # culoarea conturului
  interval: 0.7         # secunde intre doua treceri
  max_per_pass: 6       # cate obiecte incearca intr-o trecere
  click_offset_y: 12    # eticheta e deasupra obiectului
  blacklist_seconds: 12 # cat ignora un obiect pe care l-a incercat

mount:
  retry_seconds: 25
  cast_seconds: 2.0

record:
  hotkeys:
    f4: portal
    f5: travel
    f6: combat
    f8: vendor
  pause_key: f9
  stop_key: f10

safety:
  kill_key: f12
  pause_key: f11
  max_runtime_minutes: 120
  breaks: true
  stuck_seconds: 90
